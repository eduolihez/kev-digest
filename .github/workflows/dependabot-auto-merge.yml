name: "Dependabot auto-merge"

# Repo privado: GitHub Free no permite el auto-merge "diferido" aqui (falla
# con "Auto merge is not allowed for this repository"). Por eso este
# workflow se dispara tambien cuando termina el CI (workflow_run) y, en ese
# momento, el PR ya deberia estar limpio -> fusion inmediata sin necesitar
# esa funcion. El intento por pull_request se deja como via rapida para
# cuando el PR ya esta limpio nada mas abrirse.

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Resolver numero de PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            NUM=$(gh api "repos/${{ github.repository }}/commits/${{ github.event.workflow_run.head_sha }}/pulls" --jq '.[0].number // empty')
            echo "number=$NUM" >> "$GITHUB_OUTPUT"
          fi

      - name: Evaluar y fusionar si procede
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUM: ${{ steps.pr.outputs.number }}
        run: |
          AUTHOR=$(gh pr view "$NUM" --repo "$REPO" --json author --jq '.author.login')
          if [ "$AUTHOR" != "dependabot[bot]" ]; then
            echo "No es un PR de Dependabot, nada que hacer."
            exit 0
          fi

          TITLE=$(gh pr view "$NUM" --repo "$REPO" --json title --jq '.title')
          HEAD_REF=$(gh pr view "$NUM" --repo "$REPO" --json headRefName --jq '.headRefName')

          IS_ACTIONS=false
          case "$HEAD_REF" in *github_actions*) IS_ACTIONS=true ;; esac

          MAJOR=false
          if [ "$IS_ACTIONS" = "false" ]; then
            A=$(echo "$TITLE" | grep -ioE 'from [0-9]+' | head -1 | grep -oE '[0-9]+')
            B=$(echo "$TITLE" | grep -ioE 'to [0-9]+' | head -1 | grep -oE '[0-9]+')
            if [ -n "$A" ] && [ -n "$B" ] && [ "$A" != "$B" ]; then
              MAJOR=true
            fi
          fi

          if [ "$MAJOR" = "true" ]; then
            echo "Bump mayor, se deja para revision manual: $TITLE"
            exit 0
          fi

          gh pr review --approve "$NUM" --repo "$REPO" || true
          gh pr merge "$NUM" --repo "$REPO" --squash --auto \
            || gh pr merge "$NUM" --repo "$REPO" --squash \
            || echo "Todavia no fusionable (checks pendientes); se reintentara cuando termine el CI."
