name: "Dependabot auto-merge"

# ===========================================================================
#  Aprueba y fusiona sola cualquier actualizacion de Dependabot que no sea
#  un salto de version mayor.
#
#  HISTORIA: mientras el repositorio era privado, GitHub Free no ofrecia el
#  auto-merge diferido ("Auto merge is not allowed for this repository"), asi
#  que aqui habia un rodeo: disparar tambien por workflow_run y deducir del
#  titulo del PR, a base de grep, si el salto era mayor. Ese rodeo ademas
#  nunca llego a funcionar del todo, porque el bloque `on:` solo declaraba
#  pull_request y la rama de workflow_run era codigo muerto.
#
#  Al pasar el repositorio a publico el auto-merge esta disponible y todo eso
#  sobra: dependabot/fetch-metadata da el tipo de actualizacion de forma
#  fiable, sin adivinar nada a partir del texto.
#
#  REQUISITOS (ajustes del repositorio, no de este archivo):
#    - Settings > General > "Allow auto-merge"
#    - Settings > Actions > General > "Allow GitHub Actions to create and
#      approve pull requests"
# ===========================================================================

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Leer metadatos del PR de Dependabot
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Auto-aprobar y activar auto-merge (squash)
        # Todo menos los saltos mayores. Las GitHub Actions se fusionan
        # siempre: son las unicas dependencias del repositorio y sus versiones
        # mayores rara vez rompen nada.
        if: |
          steps.metadata.outputs.update-type != 'version-update:semver-major' ||
          steps.metadata.outputs.package-ecosystem == 'github_actions'
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --squash --auto "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
